plugins {
    id 'com.android.application'
}

android {
    namespace 'com.homenet.agent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.homenet.agent'
        minSdk 19
        targetSdk 35
        versionCode 5
        versionName '0.1.5'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
