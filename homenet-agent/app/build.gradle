plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('HOMENET_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('HOMENET_KEYSTORE_PASSWORD')
def releaseKeyPassword = System.getenv('HOMENET_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyPassword

android {
    namespace 'com.homenet.agent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.homenet.agent'
        minSdk 23
        targetSdk 35
        versionCode 19
        versionName '0.6.0'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias 'homenet-agent'
                keyPassword releaseKeyPassword
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
