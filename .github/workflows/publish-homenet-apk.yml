name: Publish HomeNet Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'homenet-agent/**'
      - '.github/workflows/publish-homenet-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare release keystore
        env:
          HOMENET_KEYSTORE_BASE64: ${{ secrets.HOMENET_KEYSTORE_BASE64 }}
        run: echo "$HOMENET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/homenet-release.p12"

      - name: Build signed release APK
        working-directory: homenet-agent
        env:
          HOMENET_KEYSTORE_PATH: ${{ runner.temp }}/homenet-release.p12
          HOMENET_KEYSTORE_PASSWORD: ${{ secrets.HOMENET_KEYSTORE_PASSWORD }}
          HOMENET_KEY_PASSWORD: ${{ secrets.HOMENET_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs homenet-agent/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK in repository
        run: |
          cp homenet-agent/app/build/outputs/apk/release/app-release.apk HomeNet-Agent-latest.apk
          cp homenet-agent/app/build/outputs/apk/release/app-release.apk HomeNet-Agent-v0.2.2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f HomeNet-Agent-latest.apk HomeNet-Agent-v0.2.2.apk
          git commit -m "Publish signed HomeNet Agent v0.2.2 APK" || exit 0
          git push
