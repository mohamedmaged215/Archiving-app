name: Publish HomeNet Agent APK

on:
  push:
    branches: [ main ]
    paths:
      - 'homenet-agent/**'
      - '.github/workflows/publish-homenet-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build compatible APK
        working-directory: homenet-agent
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish APK in repository
        run: |
          cp homenet-agent/app/build/outputs/apk/debug/app-debug.apk HomeNet-Agent-latest.apk
          cp homenet-agent/app/build/outputs/apk/debug/app-debug.apk HomeNet-Agent-v0.1.4.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f HomeNet-Agent-latest.apk HomeNet-Agent-v0.1.4.apk
          git commit -m "Publish HomeNet Agent v0.1.4 APK" || exit 0
          git push
